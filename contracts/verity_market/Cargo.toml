[package]
name = "verity-market"
description = "Verity: perpetual True/False markets for encyclopedia facts, settled by an AI judge with a dispute window"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
# near-sdk 5.27.0 is the newest that builds with Rust 1.92; resolver 3 respects rust-version.
resolver = "3"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.27.0"

[dev-dependencies]
near-sdk = { version = "5.27.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
